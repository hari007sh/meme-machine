# Runs on the server. The app joins the "edge" network shared with the Hookboard Cloudflare tunnel;
# OpenSearch stays on an internal network and is never published to the host or the internet.
name: meme-machine
services:
  app:
    container_name: meme-app
    build: ..
    user: "1026:100"   # the server user that owns ./data
    env_file: ../.env
    volumes:
      - ../data:/data
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped
    networks: [edge, search]

  opensearch:
    image: opensearchproject/opensearch:2.19.3
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - bootstrap.memory_lock=false
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [search]

volumes:
  opensearch-data:

networks:
  edge:
    external: true
  search: {}
